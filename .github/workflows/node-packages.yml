name: Build NestLive beta packages

on:
  workflow_dispatch:
  pull_request:
    branches: [main, production]
    paths:
      - 'packages/**'
      - 'apps/live/**'
      - 'distribution/**'
      - 'package.json'
      - '.github/workflows/node-packages.yml'
  push:
    branches: [production]

permissions:
  contents: read

env:
  NESTLIVE_VERSION: 0.1.0-beta.1

concurrency:
  group: nestlive-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: nestlive-windows-x64
          - name: macOS arm64
            os: macos-14
            artifact: nestlive-macos-arm64
          - name: Linux x64
            os: ubuntu-latest
            artifact: nestlive-linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Verify
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Build SEA runtimes
        run: |
          npm run package:sea --workspace=@millionsnest/nestlive-production-node
          npm run package:sea --workspace=@millionsnest/nestlive-node
          npm run package:sea --workspace=@millionsnest/nestlive-service

      - name: Stage Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "nestlive"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $out "web") | Out-Null
          Copy-Item "packages/nestlive-service/dist/NestLiveService.exe" $out
          Copy-Item "packages/nestlive-node/dist/NestLiveAudioNode.exe" $out
          Copy-Item "packages/production-node/dist/NestLiveProductionNode.exe" $out
          Copy-Item "apps/live/dist/*" (Join-Path $out "web") -Recurse -Force
          Copy-Item "distribution/windows/install.ps1" $out
          Copy-Item "distribution/windows/uninstall.ps1" $out
          Copy-Item "distribution/windows/INSTALAR-NESTLIVE.cmd" $out
          Copy-Item "distribution/README-INSTALL.md" $out
          "PACKAGE_DIR=$out" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DSourceDir=$env:PACKAGE_DIR" "/DOutputDir=$env:PACKAGE_DIR" "/DAppVersion=$env:NESTLIVE_VERSION" "distribution/windows/NestLive.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed." }

      - name: Stage Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/nestlive"
          mkdir -p "$out/web"
          cp packages/nestlive-service/dist/NestLiveService "$out/"
          cp packages/nestlive-node/dist/NestLiveAudioNode "$out/"
          cp packages/production-node/dist/NestLiveProductionNode "$out/"
          chmod +x "$out"/NestLive*
          cp -R apps/live/dist/. "$out/web/"
          cp distribution/README-INSTALL.md "$out/"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            cp distribution/macos/install.command "$out/"
            cp distribution/macos/uninstall.command "$out/"
            chmod +x "$out"/*.command
          else
            cp distribution/linux/install.sh "$out/"
            cp distribution/linux/uninstall.sh "$out/"
            chmod +x "$out"/*.sh
          fi
          echo "PACKAGE_DIR=$out" >> "$GITHUB_ENV"

      - name: Smoke unified runtime
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cd "$PACKAGE_DIR"
          ./NestLiveService >service.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4317/health >/dev/null; then
              exit 0
            fi
            sleep .5
          done
          cat service.log
          exit 1

      - name: Smoke unified runtime on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath (Join-Path $env:PACKAGE_DIR "NestLiveService.exe") -WorkingDirectory $env:PACKAGE_DIR -PassThru
          try {
            $ok = $false
            for ($i=0; $i -lt 20; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $r = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:4317/health" -TimeoutSec 2
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) { throw "NestLive gateway did not become healthy." }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Get-Process NestLiveAudioNode,NestLiveProductionNode -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: Hash package
        shell: bash
        if: runner.os != 'Windows'
        run: |
          cd "$PACKAGE_DIR"
          shasum -a 256 NestLiveService NestLiveAudioNode NestLiveProductionNode > SHA256SUMS.txt

      - name: Hash package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @("NestLiveService.exe","NestLiveAudioNode.exe","NestLiveProductionNode.exe","NestLiveSetup.exe") | ForEach-Object {
            $p = Join-Path $env:PACKAGE_DIR $_
            if (Test-Path $p) {
              $h = (Get-FileHash $p -Algorithm SHA256).Hash.ToLower()
              "$h  $_" | Add-Content (Join-Path $env:PACKAGE_DIR "SHA256SUMS.txt")
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ env.NESTLIVE_VERSION }}
          path: ${{ env.PACKAGE_DIR }}
          if-no-files-found: error
          retention-days: 14
